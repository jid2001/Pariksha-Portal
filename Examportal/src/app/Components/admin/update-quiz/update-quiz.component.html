

<div class="update-quiz-wrap">
  <mat-card class="update-card"  *ngIf="!loadAddQuestion">
    <mat-card-header>
      <mat-card-title class="mat-h1">Update Quiz</mat-card-title>
      <mat-card-subtitle>Modify quiz details and settings</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form  class="quiz-form">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput name="title" [(ngModel)]="quiz.title" placeholder="Enter quiz title" required />
          <mat-hint>Give a short, clear title</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput name="desc" [(ngModel)]="quiz.description" placeholder="Enter quiz description" rows="4"></textarea>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="fill" class="col">
            <mat-label>Number of Questions</mat-label>
            <input matInput type="number" name="noOfque" [(ngModel)]="quiz.noOfQuestion" placeholder="e.g. 20" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="col">
            <mat-label>Maximum Marks</mat-label>
            <input matInput type="number" name="maxmarks" [(ngModel)]="quiz.maxMarks" placeholder="e.g. 100" />
          </mat-form-field>
        </div>

        <div class="row-inline">
          <mat-slide-toggle [(ngModel)]="quiz.active" name="active">Active</mat-slide-toggle>
          <div class="spacer"></div>
          <mat-form-field appearance="fill" class="category-select">
            <mat-label>Category</mat-label>
            <mat-select name="categories" [(ngModel)]="quiz.category.id">
              <mat-option *ngFor="let c of categories" [value]="c.id">{{ c.title }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <mat-card-actions class="actions">
          <button
            type="button"
            mat-raised-button
            color="warn"
            class="mb-2"
           (click)="addQuestion()"
          >
          <mat-icon>add</mat-icon> Add Question
        </button>
          <button type="submit" mat-raised-button color="primary"
          (click)="updateQuiz()">
            <mat-icon>save</mat-icon>
            Update Quiz
          </button>
          <button type="button" mat-stroked-button color="warn" (click)="cancel()">
            <mat-icon>close</mat-icon>
            Cancel
          </button>
        </mat-card-actions>
      </form>
    </mat-card-content>
    </mat-card>

    <mat-divider></mat-divider>
    <!-- Show add-question card only when loadAddQuestion is true -->
    <mat-card *ngIf="loadAddQuestion">
      <app-add-question
        [quizId]="id"
        [title]="quiz.title"
        (toggleComponent)="toggleAddQuestion($event)">
      </app-add-question>
    </mat-card>
    </div>
