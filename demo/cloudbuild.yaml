steps:
  # Clean previous builds
  - name: 'gcr.io/cloud-builders/mvn'
    dir: 'demo'
    args: ['clean', 'package', '-DskipTests']

#  # Run tests (optional but recommended for CI)
#  - name: 'gcr.io/cloud-builders/mvn'
#    args: ['test']
#  # Package the application, skipping tests for faster build
#  - name: 'gcr.io/cloud-builders/mvn'
#    args: ['package', '-DskipTests']


    # Copy the built jar to the root directory for Docker build context
  # Build the Docker image using the jar generated above
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'demo'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/examportal-backend:$COMMIT_SHA', '.']

  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'demo'
    args: ['push', 'gcr.io/$PROJECT_ID/examportal-backend:$COMMIT_SHA']

  # Deploy the image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'examportal-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/examportal-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=${PROJECT_ID}:asia-south1:examportal-db'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=prod'
      - '--set-env-vars=SPRING_DATASOURCE_URL=${_SPRING_DATASOURCE_URL}'
      - '--set-env-vars=SPRING_DATASOURCE_USERNAME=${_SPRING_DATASOURCE_USERNAME}'
      - '--set-env-vars=SPRING_DATASOURCE_PASSWORD=${_SPRING_DATASOURCE_PASSWORD}'

images:
  - 'gcr.io/$PROJECT_ID/examportal-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

# Substitution variables required for this build
substitutions:
  _SPRING_DATASOURCE_URL: '' # Database URL (e.g., jdbc:mysql://host:port/database)
  _SPRING_DATASOURCE_USERNAME: '' # Database username
  _SPRING_DATASOURCE_PASSWORD: '' # Database password
